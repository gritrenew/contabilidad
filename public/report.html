<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contabilidad · Reporte</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark"></span> Contabilidad · Grupo</div>
  <nav class="nav-links">
    <a href="/">Dashboard</a>
    <a href="/report.html">Reporte</a>
    <a href="/settings.html">Mantenedor</a>
  </nav>
  <div class="top-actions">
    <span class="env-pill" id="sync-pill">—</span>
    <button class="theme-toggle" id="theme-toggle" title="Cambiar tema">☽</button>
  </div>
</header>

<main class="page">
  <div class="page-header">
    <div>
      <h1>Reporte por cuenta</h1>
      <div class="subtitle">N° cuenta · Nombre de cuenta · Saldo (divisa adicional) por año y mes — multiempresa</div>
    </div>
  </div>

  <div id="not-configured" class="empty-state card" style="display:none;">
    <h3>La conexión aún no está configurada</h3>
    <p>Ve a <a href="/settings.html">Mantenedor</a> para ingresar el servidor, base de datos y credenciales de Business Central.</p>
  </div>

  <div id="app-content" style="display:none;">
    <div class="filter-bar">
      <div class="field" style="min-width:240px;">
        <label>Empresas</label>
        <select id="f-companies" multiple size="4"></select>
      </div>
      <div class="field" style="min-width:160px;">
        <label>País</label>
        <select id="f-countries" multiple size="4"></select>
      </div>
      <div class="field">
        <label>Años</label>
        <select id="f-years" multiple size="4"></select>
      </div>
      <div class="field">
        <label>Meses</label>
        <select id="f-months" multiple size="4">
          <option value="1">Ene</option><option value="2">Feb</option><option value="3">Mar</option>
          <option value="4">Abr</option><option value="5">May</option><option value="6">Jun</option>
          <option value="7">Jul</option><option value="8">Ago</option><option value="9">Sep</option>
          <option value="10">Oct</option><option value="11">Nov</option><option value="12">Dic</option>
        </select>
      </div>
      <div class="field">
        <label>Rubro</label>
        <select id="f-rubro">
          <option value="">Todos</option>
          <option value="Activo">Activo</option>
          <option value="Pasivo">Pasivo</option>
          <option value="Patrimonio">Patrimonio</option>
          <option value="Ingreso">Ingreso</option>
          <option value="Gasto">Gasto</option>
          <option value="Otro">Otro</option>
        </select>
      </div>
      <div class="field" style="min-width:220px;">
        <label>Buscar cuenta (N° o nombre)</label>
        <input type="text" id="f-search" placeholder="ej. 110100 o BANCO" />
      </div>
      <button class="btn" id="btn-apply">Aplicar filtros</button>
      <button class="btn secondary" id="btn-clear">Limpiar</button>
      <div class="spacer"></div>
      <button class="btn secondary" id="btn-export">Exportar CSV</button>
    </div>

    <div id="loading-line" class="loading-line" style="display:none; margin-bottom:16px;"></div>
    <div class="hint" id="row-count" style="margin-bottom:8px;"></div>

    <div class="table-scroll">
      <table id="pivot-table">
        <thead><tr id="pivot-head"></tr></thead>
        <tbody id="pivot-body"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/report.js"></script>
</body>
</html>
